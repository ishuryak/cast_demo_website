<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="lamp-title lamp-desc">
<title id="lamp-title">A lamp lights several threads; one runs past the light</title>
<desc id="lamp-desc">A quiet hanging lamp lights a cone of space. Several sketched threads connect two small knots inside the light. One thread leaves the lit area and fades into the margin.</desc>
