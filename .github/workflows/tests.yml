# Run every test suite on every push and pull request, in two jobs.
#
# site-contract: the node suites, which need no R and no pipeline run. They
# cover the failures that have actually broken this site before -- the front
# end and the exported scenarios.json drifting apart, CSS that silently refuses
# to size an element the markup sizes, prose quoting a number the export no
# longer contains, and files that should never have been published.
#
# r-suites: the R suites (cast_core math, export labels, fit contract, source
# guards, sim provenance) plus the educator kit's R checks. Until 2026-09-25 CI
# ran no R at all, so a change to R/cast_core.R that broke the CAST golden
# values went green here and was caught only by a local ./tests/run_tests.sh.
# The five pipeline suites are base R; grf is installed only for the class-lab
# check, from Posit Package Manager binaries so the job stays in minutes.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Site data contract (every field app.js reads exists and lines up)
        run: node tests/test_data_contract.mjs docs/data/scenarios.json

      - name: Site render smoke (app.js runs at all 24 control positions)
        run: node tests/test_render_smoke.mjs docs/data/scenarios.json

      - name: Site style contract (CSS actually sizes what the markup sizes)
        run: node tests/test_style_contract.mjs

      - name: Introduction contract (the page opens with something a non-specialist can read)
        run: node tests/test_intro_contract.mjs

      - name: FIXES.md order (the evidence record matches its own claim)
        run: node tests/test_fixes_order.mjs

      - name: README claims (every quoted number recomputed from the export)
        run: node tests/test_readme_claims.mjs docs/data/scenarios.json

      - name: Repo hygiene (no gitlink, scratch, stale attestation or tool note)
        run: node tests/test_repo_hygiene.mjs

      # The runner image ships Chrome; the suite skips cleanly if a future one
      # does not, so this step can never fail for the absence of a browser.
      - name: Viewport overflow (the page fits a phone, measured not screenshotted)
        run: node tests/test_viewport_overflow.mjs

      - name: Tutorial variants (v1, v2, v3 and the /oncology/ redirect are whole, separate pages)
        run: node tests/test_tutorial_variants.mjs docs

      - name: Clinical display accuracy and narrative contracts
        run: npm run test:clinical

      - name: Viewport overflow on the tutorial variants
        run: |
          node tests/test_viewport_overflow.mjs docs/tutorial
          node tests/test_viewport_overflow.mjs docs/tutorial_v2
          node tests/test_viewport_overflow.mjs docs/tutorial_v3

      - name: Shipped site is complete
        run: |
          set -euo pipefail
          for f in docs/index.html docs/app.js docs/style.css \
                   docs/data/scenarios.json; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done
          # .nojekyll is legitimately EMPTY (its presence is the signal that
          # tells Pages not to run Jekyll), so it is checked with -f, not -s.
          test -f docs/.nojekyll || { echo "::error::missing docs/.nojekyll"; exit 1; }
          n=$(ls docs/figs/*.png | wc -l)
          test "$n" -eq 9 || { echo "::error::expected 9 figures, found $n"; exit 1; }
          echo "docs/ complete: 9 figures, all site assets present"

      - name: Walkthrough tests and GitHub Pages build
        run: |
          npm test
          npm run build:pages
          git diff --exit-code -- docs tutorial/class-kit tutorial/downloads
          test -z "$(git ls-files --others --exclude-standard -- docs)"

  r-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install grf, survival and jsonlite
        run: Rscript -e 'install.packages(c("grf", "survival", "jsonlite"))'

      - name: Pipeline R suites (the same five ./tests/run_tests.sh runs)
        run: |
          set -euo pipefail
          for t in test_cast_core.R test_export_labels.R test_fit_contract.R \
                   test_source_guards.R test_sim_provenance.R; do
            echo "--- $t"
            Rscript "tests/$t"
          done

      - name: Educator kit R checks (exercise input validation, class-lab contract)
        run: |
          set -euo pipefail
          Rscript tutorial/tests/exercise.test.R
          Rscript tutorial/tests/class-lab.test.R
