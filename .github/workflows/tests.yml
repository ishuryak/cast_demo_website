# Run the site-facing test suites on every push and pull request.
#
# Scope is deliberate: the nine node suites need no R and no pipeline run, so
# they execute in seconds on a stock runner and cover the failures that have
# actually broken this site before -- the front end and the exported
# scenarios.json drifting apart, CSS that silently refuses to size an element the
# markup sizes, and prose quoting a number the export no longer contains. The
# five R suites (cast_core math, export labels, fit contract, source guards, sim
# provenance) need R plus grf, which would turn a ten-second job into a
# multi-minute one; run those locally with ./tests/run_tests.sh, which runs all
# fourteen.
#
# KNOWN GAP, stated rather than left to be discovered: because the R suites do
# not run here, the CAST golden-value math is not covered by CI. A change to
# R/cast_core.R that breaks it goes green on this workflow and is caught only by
# a local ./tests/run_tests.sh.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Site data contract (every field app.js reads exists and lines up)
        run: node tests/test_data_contract.mjs docs/data/scenarios.json

      - name: Site render smoke (app.js runs at all 24 control positions)
        run: node tests/test_render_smoke.mjs docs/data/scenarios.json

      - name: Site style contract (CSS actually sizes what the markup sizes)
        run: node tests/test_style_contract.mjs

      - name: Introduction contract (the page opens with something a non-specialist can read)
        run: node tests/test_intro_contract.mjs

      - name: FIXES.md order (the evidence record matches its own claim)
        run: node tests/test_fixes_order.mjs

      - name: Clinical page contract (units, coverage, acronyms, shared data)
        run: node tests/test_clinical_contract.mjs docs/data/scenarios.json

      - name: README claims (every quoted number recomputed from the export)
        run: node tests/test_readme_claims.mjs docs/data/scenarios.json

      - name: Repo hygiene (no gitlink, no backups or scratch in the tree)
        run: node tests/test_repo_hygiene.mjs

      # The runner image ships Chrome; the suite skips cleanly if a future one
      # does not, so this step can never fail for the absence of a browser.
      - name: Viewport overflow (the page fits a phone, measured not screenshotted)
        run: node tests/test_viewport_overflow.mjs

      - name: Shipped site is complete
        run: |
          set -euo pipefail
          for f in docs/index.html docs/app.js docs/style.css \
                   docs/data/scenarios.json \
                   docs/clinical/index.html docs/clinical/app.js \
                   docs/clinical/style.css; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done
          # .nojekyll is legitimately EMPTY (its presence is the signal that
          # tells Pages not to run Jekyll), so it is checked with -f, not -s.
          test -f docs/.nojekyll || { echo "::error::missing docs/.nojekyll"; exit 1; }
          n=$(ls docs/figs/*.png | wc -l)
          test "$n" -eq 9 || { echo "::error::expected 9 figures, found $n"; exit 1; }
          echo "docs/ complete: 9 figures, all site assets present"

      - name: Walkthrough tests and GitHub Pages build
        run: |
          npm test
          npm run build:pages
          git diff --exit-code -- docs/tutorial tutorial/class-kit tutorial/downloads
          test -z "$(git ls-files --others --exclude-standard -- docs/tutorial)"
