<title id="wb-title">The well-behaved case: a constant hazard ratio shown three ways</title>
<desc id="wb-desc">Left: survival curves for treated and control separate steadily. Middle: log(−log S) against log t gives two parallel lines whose gap is log HR at every time. Right: the survival difference that the one number implies rises and then narrows as both groups run out of survivors.</desc>
