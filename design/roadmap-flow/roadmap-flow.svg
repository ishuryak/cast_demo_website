<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">From a target-trial protocol to causal interpretation</title><desc id="desc">Seven steps, with revision when the question lacks support.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#075d65"/></marker></defs><rect width="720" height="1000" fill="white"/><g font-family="Arial, sans-serif" fill="#242a29"><text x="60" y="44" font-size="23">Follow the causal roadmap</text><rect x="60" y="80" width="590" height="85" rx="4" fill="#edf3ef" stroke="#075d65"/><text x="80" y="109" font-size="16" fill="#075d65">01</text><text x="125" y="109" font-size="20">State the question</text><text x="125" y="138" font-size="16">Write the target-trial protocol.</text><path d="M355 165 V190" stroke="#075d65" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="195" width="590" height="85" rx="4" fill="#edf3ef" stroke="#075d65"/><text x="80" y="224" font-size="16" fill="#075d65">02</text><text x="125" y="224" font-size="20">Specify a causal model</text><text x="125" y="253" font-size="16">Name the causes and the causal effect.</text><path d="M355 280 V305" stroke="#075d65" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="310" width="590" height="85" rx="4" fill="#edf3ef" stroke="#075d65"/><text x="80" y="339" font-size="16" fill="#075d65">03</text><text x="125" y="339" font-size="20">Examine the data</text><text x="125" y="368" font-size="16">What is observed, and what is missing?</text><path d="M355 395 V420" stroke="#075d65" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="425" width="590" height="85" rx="4" fill="#edf3ef" stroke="#075d65"/><text x="80" y="454" font-size="16" fill="#075d65">04</text><text x="125" y="454" font-size="20">Assess identification</text><text x="125" y="483" font-size="16">Can assumptions connect data to effect?</text><path d="M355 510 V535" stroke="#075d65" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="540" width="590" height="85" rx="4" fill="#edf3ef" stroke="#075d65"/><text x="80" y="569" font-size="16" fill="#075d65">05</text><text x="125" y="569" font-size="20">Define the statistical target</text><text x="125" y="598" font-size="16">What quantity in the data will answer it?</text><path d="M355 625 V650" stroke="#075d65" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="655" width="590" height="85" rx="4" fill="#edf3ef" stroke="#075d65"/><text x="80" y="684" font-size="16" fill="#075d65">06</text><text x="125" y="684" font-size="20">Estimate with uncertainty</text><text x="125" y="713" font-size="16">Choose methods for that target.</text><path d="M355 740 V765" stroke="#075d65" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="770" width="590" height="85" rx="4" fill="#edf3ef" stroke="#075d65"/><text x="80" y="799" font-size="16" fill="#075d65">07</text><text x="125" y="799" font-size="20">Challenge and interpret</text><text x="125" y="828" font-size="16">Test sensitivity; state scope and limits.</text><text x="60" y="920" font-size="15">If support is inadequate, revise the question, assumptions or data.</text><text x="60" y="953" font-size="13">Simplified from Dang and Balzer (2023).</text><text x="60" y="975" font-size="13">doi:10.1097/EDE.0000000000001636</text></g></svg>