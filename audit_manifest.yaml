  simulation-audit:
    status: RUN
    justification: >-
      Every cohort is simulated, so this auditor applies. sim_provenance.yaml
      registers all 60 data-generating parameters (56 user_supplied design
      assumptions, 4 derived) and `sim_provenance.py validate` reports
      `registry OK` as of 2026-08-26. Before this pass it did not: the registry
      used a project-local schema the engine rejected with `unknown top-level
      key(s): meta`, so the auditor had never read it.
      KNOWN GAP, recorded rather than papered over: `check --strict` additionally
      needs a run trace (simulation_input_trace.csv + simulation_provenance.json)
      that R/01_simulate.R does not emit. Emitting one means routing every
      parameter read through the provenance logger, a change to the generating
      code that would force a re-run of the published grid, and it was not made
      in this pass. In the meantime tests/test_sim_provenance.R pins each of the
      54 registered values to a regex matching the exact construct it comes from,
      which is what actually catches registry-vs-code drift.
    run:
      registry: sim_provenance.yaml
      run_dir: output            # no trace emitted here yet; see justification
