  ml-practitioner-review:
    status: RUN
    justification: >-
      The Causal Survival Forest (grf::causal_survival_forest) and Random Survival Forests
      (grf::regression_forest for RSF S-learner/T-learner) are learned models. The CSF
      uses orthogonalized estimation (double ML style). The RSF models are baselines.
      Sample size n=2000, 5 horizons, 6 covariates. The code uses explicit seeds for
      reproducibility. CAST is a post-processing layer (quadratic trajectory fit with
      Ledoit-Wolf shrinkage) applied to CSF outputs, not a learned model itself.
      This was reviewed in the 2026-08-25 methods audit.
    completion:
      inputs:
        - {path: R/02_fit_methods.R, sha256: sha256:a44decb5aac3d03f9bdc0687dac37107f059dd0b40e6d4e4ade740a9a8ee9ff3}
