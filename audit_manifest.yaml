# audit_manifest.yaml -- project-local auditor routing record.
#
# The recorded verdict for EACH of the twelve auditors is the artifact proving
# coverage was considered rather than forgotten. Run the gate with:
#
#   python3 ~/.claude/routing/audit_gate.py --project .            # draft
#   python3 ~/.claude/routing/audit_gate.py --project . --release  # hard gate
#
# The stale-constant audit IS one of the routed auditors -- the thirteenth. It
# has its own engine, and the gate enumerates it, requires this manifest to
# account for it, and runs the engine itself under --release. It is recorded
# below like any other rather than in this header.
#
# NOTE ON SCOPE. This project's deliverable is a static teaching WEBSITE plus the
# R pipeline that generates it. It is not a manuscript, grant, LOI, poster or
# abstract, and it ships no patient data. Several auditors below are therefore
# N/A on the deliverable's nature, which is a permanent property of this project
# and NOT a deferral on project stage.

# 2026-09-18, ATTESTATION HASHES. Every sha256 in this file was recomputed on
# this date. Two different problems were found and both are fixed above:
#
#   * FOUR values were not sha256 digests at all. They were 63 or 65 hex
#     characters in hand-typed walking-nibble patterns
#     (c2d3e4f5a6b7c8d9..., c3d4e5f6a7b8c9d0..., d4e5f6a7b8c9d0e1...,
#     8a7b6c5d4e3f2a1b...), and the last of those stood as the report_sha256 of
#     THREE different reports at once. They were never computed from anything,
#     so the attestations carrying them bound nothing: the file they named could
#     change freely and no check would notice, because no check compared them to
#     a file. audit_gate.py reported one of them as merely "stale", which is the
#     wrong diagnosis and the reason this went unseen.
#   * FOUR were real digests that had gone stale, because README.md,
#     docs/index.html, sim_provenance.yaml and constant_registry.yaml were all
#     edited in the 2026-09-18 audit pass.
#
# tests/test_repo_hygiene.mjs now recomputes every hash in this file on each run,
# so neither form can return silently. Re-taking a hash is only honest when the
# finding it attests to still holds against the new content; where an edit was
# prose-only, that is recorded beside the entry.
#
# 2026-09-21. FOUR hashes re-taken, all docs/tutorial/index.html, under
# manuscript-audit and reader-first-audit. The edit added a fifth reader path
# ("Clinician or oncologist", placed first) with its itinerary, a no-JavaScript
# fallback link, and a CSS class on the one stop that leaves the walkthrough. It
# adds no number and changes no display item, so the manuscript-audit finding is
# untouched; and it gives an audience that previously had none a route through
# the page, which is a reader-first improvement rather than a regression, so the
# reader-first finding still holds. Re-taking both is therefore honest. Pinned
# going forward by tutorial/tests/narrative.test.mjs, which asserts the path set,
# the clinician path's first position, the three-stop count each itinerary
# announces, and the outbound link in both the scripted and no-script routes.
#
# 2026-09-20. ONE hash re-taken: README.md, under paper-code-audit. The edit added
# the oncology view to the header links and the layout tree, corrected two suite
# counts, and stated that the clinical and oncology views are not yet published.
# It touched no description of what the R code computes, so the paper-code
# correspondence that hash attests to is unchanged and re-taking it is honest.
# No other attested file was edited in this pass.

