# audit_manifest.yaml -- project-local auditor routing record.
#
# The recorded verdict for EACH of the twelve auditors is the artifact proving
# coverage was considered rather than forgotten. Run the gate with:
#
#   python3 ~/.claude/routing/audit_gate.py --project .            # draft
#   python3 ~/.claude/routing/audit_gate.py --project . --release  # hard gate
#
# The stale-constant audit IS one of the routed auditors -- the thirteenth. It
# has its own engine, and the gate enumerates it, requires this manifest to
# account for it, and runs the engine itself under --release. It is recorded
# below like any other rather than in this header.
#
# NOTE ON SCOPE. This project's deliverable is a static teaching WEBSITE plus the
# R pipeline that generates it. It is not a manuscript, grant, LOI, poster or
# abstract, and it ships no patient data. Several auditors below are therefore
# N/A on the deliverable's nature, which is a permanent property of this project
# and NOT a deferral on project stage.

project: cast_demo_website
generated_on: 2026-09-18

deliverables:
  - none         # a static website + its generating pipeline; no scientific
                 # document deliverable exists or is planned. The public-facing
                 # teaching website lives at https://ishuryak.github.io/cast_demo_website/
                 # The illustrated CAST walkthrough at https://ishuryak.github.io/cast_demo_website/tutorial/

canonical_artifacts:
  analysis_code:
    - R/cast_core.R
    - R/01_simulate.R
    - R/02_fit_methods.R
    - R/03_export.R
    - R/scenario_labels.R
  manuscript: []
  grant: []

facts:
  has_causal_claim: true          # the whole demo is a treatment-effect
                                  # comparison against a known true ATE(t).
  has_radiation: false            # FALSE POSITIVE: Yang et al. (2026) applied CAST to radiotherapy,
                                  # but THIS project is a teaching demo on SIMULATED oncology data
                                  # with an abstract binary treatment W. No radiotherapy, dosimetry,
                                  # or radiation-treated cohort exists in this codebase.
  is_grant: false                 # FALSE POSITIVE: No grant or proposal is being written here.
  is_simulation: true             # Every cohort is simulated from R/01_simulate.R
  has_analysis_code: true         # R/01_simulate.R, R/02_fit_methods.R, R/cast_core.R
  has_analysis_computation: true  # The pipeline computes estimates vs known truth

