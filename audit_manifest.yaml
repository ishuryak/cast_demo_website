        - {path: R/01_simulate.R, sha256: sha256:7ce49ec2e4625f419afa207fd6d2d580c66fcc82c2510abac605383cb8a19007}
        - {path: sim_provenance.yaml, sha256: sha256:6c7b3805925e064d97144ddf17cfd0e5244e1ada0f74f1b0ad12cfe47ae0ea2a}

  stale-constant-audit:
    status: RUN
    justification: >-
      The project performs analysis computation, so a hard-coded bound that was
      true of an earlier parameterization is exactly the failure this auditor
      exists to catch, and every other auditor is blind to it: a stale constant
      produces a FRESH output that a freshness check then certifies. Twelve
      constants are registered in constant_registry.yaml -- the horizon grid, the
      two confounding axes, the cohort size, the censoring bound, the seed base
      and the estimation-side thresholds -- each with what keeps it true.
      `--strict` reports REGISTRY (12 constants) STRICT, 0 errors, 0 warnings as
      of 2026-08-28. It runs BEFORE any freshness check, per the rule.
    run:
      project: "."
      registry: constant_registry.yaml
      inputs:
        - {path: constant_registry.yaml, sha256: sha256:e08fb6dfd0080000bc63b48843f4150689711adc511d6269d33e84f563f341e3}
        - {path: R/01_simulate.R, sha256: sha256:7ce49ec2e4625f419afa207fd6d2d580c66fcc82c2510abac605383cb8a19007}
